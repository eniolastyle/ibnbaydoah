name: Build & Deploy to Coolify

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  validate-and-build:
    name: Typecheck & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript typecheck
        run: npm run lint

      - name: Build frontend production bundle
        run: npm run build

  deploy-to-coolify:
    name: Trigger Coolify Deployment
    needs: validate-and-build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Trigger Coolify Webhook
        env:
          COOLIFY_WEBHOOK_URL: ${{ secrets.COOLIFY_WEBHOOK_URL }}
        run: |
          if [ -z "$COOLIFY_WEBHOOK_URL" ]; then
            echo "❌ ERROR: COOLIFY_WEBHOOK_URL secret is not set in this GitHub repository."
            echo "👉 Go to: Repo Settings -> Secrets and variables -> Actions -> New repository secret"
            echo "👉 Add 'COOLIFY_WEBHOOK_URL' with the Webhook URL from your Coolify Application settings."
            exit 1
          fi

          echo "🚀 Sending deployment trigger to Coolify..."
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X GET "$COOLIFY_WEBHOOK_URL")
          HTTP_STATUS=$(echo "$RESPONSE" | grep "HTTP_STATUS:" | cut -d':' -f2)
          BODY=$(echo "$RESPONSE" | grep -v "HTTP_STATUS:")

          echo "Response Body: $BODY"
          echo "HTTP Status Code: $HTTP_STATUS"

          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
            echo "✅ Successfully triggered deployment in Coolify!"
          else
            echo "❌ Deployment trigger failed with HTTP status $HTTP_STATUS"
            exit 1
          fi
