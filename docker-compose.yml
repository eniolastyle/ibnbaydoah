version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ibn_baydoah_app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgresql://${POSTGRES_USER:-baydoah}:${POSTGRES_PASSWORD:-scholarly_pwd_1446}@postgres:5432/${POSTGRES_DB:-ibnbaydoah_db}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-baydoah1446}
    volumes:
      - ./server/data:/app/server/data
      - media_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: ibn_baydoah_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-baydoah}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-scholarly_pwd_1446}
      POSTGRES_DB: ${POSTGRES_DB:-ibnbaydoah_db}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-baydoah}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  media_data:
