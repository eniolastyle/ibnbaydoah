services:
  app:
    build:
      context: .
      dockerfile: Dockerfile

    restart: unless-stopped

    expose:
      - "3000"

    environment:
      NODE_ENV: production
      PORT: "3000"

    volumes:
      - ibn_baydoah_data:/app/server/data

    healthcheck:
      test:
        - CMD-SHELL
        - wget --no-verbose --tries=1 --spider http://127.0.0.1:3000/api/health || exit 1
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  ibn_baydoah_data:
    name: ibn_baydoah_data
